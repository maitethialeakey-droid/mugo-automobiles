name: Expand source archive

on:

  workflow_dispatch:
  
  push:
  
    paths:
    
      - mugo-automobiles-source.zip
      
permissions:

  contents: write
  
jobs:

  expand:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Expand archived project source
      
        run: |
        
          unzip -o mugo-automobiles-source.zip -d .source
          
          rsync -a .source/ ./ --exclude .git --exclude mugo-automobiles-source.zip --exclude .source
          
          rm -rf .source
          
          git config user.name "maitethialeakey-droid"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          git diff --cached --quiet || git commit -m "Extract Mugo Automobiles source tree"
          
          git push
          



















